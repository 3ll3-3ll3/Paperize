name: Paperize PikPak Debug CI

on:
  push:
    branches: [ "feature/pikpak-cloud-gallery" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # GitHub-hosted Ubuntu runners already include Android SDK command-line tools.
      # setup-android@v3 currently attempts to install the removed legacy "tools" package.
      - name: Install Android SDK API 37
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          # Android 17/API 37 is on the preview channel in this upstream revision.
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --channel=3 --list | grep -E 'platforms;android-(37|CinnamonBun)' || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37" "platform-tools"
      - name: Unit tests
        run: bash ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --stacktrace
      - name: Upload installable debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: paperize-pikpak-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
